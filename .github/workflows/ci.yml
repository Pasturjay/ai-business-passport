name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Run Convex Privacy & Access Tests
        run: npm run test:convex

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_CONVEX_URL: https://ci.convex.cloud
          CONVEX_DEPLOYMENT: dev:ci
          SENTRY_AUTH_TOKEN: dummy_token
          SENTRY_SUPPRESS_TURBOPACK_WARNING: "1"

  preview-deploy:
    name: Vercel Preview Deployment Check
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Preview Readiness
        run: |
          echo "Automated checks passed. Ready for Vercel preview deployment on PR #${{ github.event.pull_request.number }}."
